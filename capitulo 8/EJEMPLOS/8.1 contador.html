<!DOCTYPE html>
<html>

    <div class="reg">
        <a class="regresar" href="ejemplos.html">⬅</a>

      <meta charset= "utf-8">
      <title>Repetición controlada por contador</title>
      <script>

         var contador = 1; // inicialización

         while ( contador <= 7) // condición de repetición
         {
            document.writeln( "<p style = 'font-size: " +
               contador + "ex'>Tama&ntilde;o de fuente de HTML5 " + contador + "ex</p>" );
            ++contador; // incremento
         } //fin de while

      </script>
   </head><body></body>
</html>
