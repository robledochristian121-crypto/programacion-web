<!DOCTYPE html>
<html>
   <head>
    <div class="reg">
        <a class="regresar" href="ejemplos.html">⬅</a>
    </div>
      <meta charset = "utf-8">
      <title>Uso de la instrucción de repetición do-while</title>
      <script>

         var contador = 1;

         do {
            document.writeln( "<h" + contador + ">&Eacute;ste es " +
               "un encabezado de nivel h" + contador + "</h" +
               contador + ">" );
            ++contador;
         } while ( contador <= 6 );

      </script>

   </head><body></body>
</html>
