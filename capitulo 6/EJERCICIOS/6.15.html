   <body>
      <h3>EJERCICIO 6.15</h3>
      <p>Escriba una secuencia de comandos que muestre los números del 1 al 4 en la misma línea, con cada par de números adyacentes
          separados por un espacio.<br>
          a) Use una instrucción document.writeln.<br>
          b) Use cuatro instrucciones document.write.</p>
      <hr>
      <script>
         document.writeln( "<p>a): 1 2 3 4</p>" );

         document.write( "<p>b): 1 " );
         document.write( "2 " );
         document.write( "3 " );
         document.write( "4</p>" );
      </script>
   </body>
