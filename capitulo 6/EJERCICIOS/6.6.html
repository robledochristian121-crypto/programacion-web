<!DOCTYPE html>
<html>

      <meta charset = "utf-8">
      <title>EJERCICIO 6</title>
      <script>
         var x, y, z, resultado;
         var xVal, yVal, zVal;

         xVal = window.prompt( "Escriba el primer entero:" );
         yVal = window.prompt( "Escriba el segundo entero:" );
         zVal = window.prompt( "Escriba el tercer entero:" );

         x = parseInt( xVal );
         y = parseInt( yVal );
         z = parseInt( zVal );

         resultado = x * y * z;
         document.writeln( "<h1>El producto es " + resultado + "</h1>" );
      </script>
   </head>
   <body></body>
</html>
