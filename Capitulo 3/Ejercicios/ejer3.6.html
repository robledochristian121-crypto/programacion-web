<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Web</title>
</head>
<body>

    <header>
        <h1>Formulario de Registro</h1>
        <p>Por favor, complete sus datos personales para registrarse en la plataforma.</p>
    </header>

    <main>
        <form action="#" method="post" autocomplete="on">
            
            <fieldset>
                <legend>Información Personal</legend>

                <div>
                    <label for="nombre">Primer Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan" autofocus>
                </div>

                <br>

                <div>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido" required placeholder="Ej. Pérez">
                </div>

                <br>

                <div>
                    <label for="email">Correo Electrónico:</label><br>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>
            </fieldset>

            <br>

            <details open>
                <summary><strong>Encuesta Académica (Opcional)</strong></summary>
                <br>
                <fieldset>
                    <legend>Información Universitaria</legend>
                    <p>¿En qué año de la universidad se encuentra actualmente?</p>
                    
                    <label for="anio-universidad">Año universitario:</label>
                    <input type="text" id="anio-universidad" name="anio_universidad" list="anios-list" placeholder="Seleccione o escriba su año">
                    
                    <datalist id="anios-list">
                        <option value="Primer año">
                        <option value="Segundo año">
                        <option value="Tercer año">
                        <option value="Cuarto año">
                        <option value="Quinto año o superior">
                        <option value="Posgrado">
                    </datalist>
                </fieldset>
            </details>

            <br>

            <div>
                <button type="submit">Completar Registro</button>
                <button type="reset">Limpiar Formulario</button>
            </div>

        </form>
    </main>

</body>
</html>
