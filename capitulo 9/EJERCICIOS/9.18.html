    <body>
    <h3>EJERCICIO 9.18</h3>
    <p>Escriba una función llamada minimo3 que devuelva el menor de tres números de punto flotante. Use la función Math.min para implementar minimo3. Incorpore la función en una secuencia de comandos que lea tres valores del usuario y determine el valor más pequeño.</p>
    <script>

        function minimo3( x, y, z )
        {
            return Math.min( x, Math.min( y, z ) );
        }

        var valor1 = parseFloat( window.prompt( "Escriba el primer número", "0" ) );
        var valor2 = parseFloat( window.prompt( "Escriba el segundo número", "0" ) );
        var valor3 = parseFloat( window.prompt( "Escriba el tercer número", "0" ) );

        document.writeln( "<ul><li>Números: " + valor1 + ", " + valor2 + ", " + valor3 + "</li>" +
            "<li><em><strong>El menor es " + minimo3( valor1, valor2, valor3 ) + "</strong></em></li></ul>" );

    </script>
    </body>
