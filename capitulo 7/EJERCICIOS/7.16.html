   <body>
      <h3>EJERCICIO 7.16</h3>
      <p>Escriba una secuencia de comandos que utilice ciclos para imprimir la siguiente tabla de valores. Muestre los resultados en una tabla de HTML5. Use CSS para centrar los datos en cada columna.</p>
      <hr>
      <script>
         var n = 1;

         document.writeln( "<table>" );
         document.writeln( "<tr><th>N</th><th>10*N</th><th>100*N</th><th>1000*N</th></tr>" );

         while ( n <= 6 )
         {
            document.writeln( "<tr><td>" + n + "</td><td>" + ( 10 * n ) +
               "</td><td>" + ( 100 * n ) + "</td><td>" + ( 1000 * n ) + "</td></tr>" );
            ++n;
         } // fin de while

         document.writeln( "</table>" );
      </script>
   </body>
