<!DOCTYPE html>
<html>
    <head>
        <meta charset = "uft-8">
        <title>Esquinas redondeadas</title>
        <style type = "text/css">
            div 
            {
                border: 3px solid navy;
                padding: 5px 20px;
                background: lightcyan;
                width: 200px;
                text-align: center;
                border-radius: 15px; /* agregar esquinas redondas */
                margin-bottom: 20px;
            }
            #redonda2 
            {
                border: 3px solid navy;
                padding: 5px 20px;
                background: lightcyan;
                width: 200px;
                text-align: center;
                border-radius: 15px; /* aumenta border-radius */
            }
        </style>
    </head>
    <body>
        <div> la propiedad border-radius agrega esquinas redondeadas
            a un elemento.</div>
            <div id = "redonda2"> Al aumentar el valor de border-radius se redondean
                aun mas las esquinas del elemento.</div>
    </body>
</html>
