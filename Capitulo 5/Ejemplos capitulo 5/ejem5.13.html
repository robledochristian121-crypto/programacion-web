<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Fusion de imagenes</title>
        <style type = "text/css">
            #portada 
            {
                position: relative;
                margin: 0 auto;
            }
            #portada img
            {
                position: absolute;
                left: 0;
                -webkit-transition: opacity 4s ease-in-out;
                transition: opacity 4s ease-in-out;
            }
            #portada img.top:hover 
            {opacity: 0;}
        </style>
    </head>
    <body>
        <div id = "portada">
            <img class = "bottom" src = "jhtp.png" alt="Poratda de Java 9e">
            <img class = "top" src="jhtp8.png" alt="Portada de Java 8e">
        </div>
    </body>
</html>
