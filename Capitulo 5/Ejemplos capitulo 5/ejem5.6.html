<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Trazo de texto</title>
        <style type = "text/css">
            h1 
            {
                color: lightcyan;
                -webkit-text-stroke: 2px black; /* prefijo de proveedor */
                font-size: 500%; /* aumenta el tamaano de la fuente */
            }
        </style>
    </head>
    <body>
        <h1>Trazo de texto</h1>
    </body>
</html>
