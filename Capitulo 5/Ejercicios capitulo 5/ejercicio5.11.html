<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5.11</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    /* Contenedor principal de las imágenes */
    .galeria-contenedor {
      position: relative;
      width: 600px;
      height: 400px;
      border: 4px solid #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
    }

    /* Estilo para cada imagen */
    .galeria-contenedor img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;

      /* Transiciones requeridas */
      transition-property: opacity;
      transition-duration: 3s;
      transition-timing-function: linear;

      /* Animación en bucle para alternar la visibilidad de las 5 imágenes */
      animation: fusionarImagenes 20s linear infinite;
    }

    /* Control de desfase para las 5 imágenes */
    .galeria-contenedor img:nth-child(1) { animation-delay: 0s; }
    .galeria-contenedor img:nth-child(2) { animation-delay: 4s; }
    .galeria-contenedor img:nth-child(3) { animation-delay: 8s; }
    .galeria-contenedor img:nth-child(4) { animation-delay: 12s; }
    .galeria-contenedor img:nth-child(5) { animation-delay: 16s; }

    /* Fotogramas clave para el efecto de fundido */
    @keyframes fusionarImagenes {
      0% {
        opacity: 0;
      }
      10% {
        opacity: 1; /* Aparece paulatinamente en 3s */
      }
      25% {
        opacity: 1; /* Permanece visible */
      }
      35% {
        opacity: 0; /* Se desvanece suavemente */
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="galeria-contenedor">
    <img src="https://picsum.photos/id/1011/600/400" alt="Edad 1 / Momento 1">
    <img src="https://picsum.photos/id/1025/600/400" alt="Edad 2 / Momento 2">
    <img src="https://picsum.photos/id/1062/600/400" alt="Edad 3 / Momento 3">
    <img src="https://picsum.photos/id/1074/600/400" alt="Edad 4 / Momento 4">
    <img src="https://picsum.photos/id/1084/600/400" alt="Edad 5 / Momento 5">
  </div>

</body>
</html>
