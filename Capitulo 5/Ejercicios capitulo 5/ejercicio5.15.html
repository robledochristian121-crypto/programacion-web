<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 5.15</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      margin: 0;
    }

    /* Contenedor del reflejo */
    .contenedor-reflejo {
      position: relative;
      display: inline-block;
    }

    .imagen-original {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      
      /* Propiedad estándar de WebKit para reflejo a la derecha con desfase de 20px */
      -webkit-box-reflect: right 20px linear-gradient(to right, transparent 50%, rgba(255, 255, 255, 0.4));
    }

    /* Alternativa compatible para todos los navegadores mediante Pseudo-elemento */
    .contenedor-reflejo::after {
      content: "";
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      margin-left: 20px; /* Separación de 20px a la derecha */
      background-image: url("https://picsum.photos/id/1018/300/200");
      background-size: cover;
      border-radius: 8px;
      
      /* Invierte la imagen horizontalmente */
      transform: scaleX(-1);
      
      /* Aplica opacidad para simular el reflejo */
      opacity: 0.5;
      
      /* Máscara de degradado para que el reflejo se desvanezca */
      mask-image: linear-gradient(to right, rgba(0,0,0,0.8), transparent);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.8), transparent);
      
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="contenedor-reflejo">
    <img src="https://picsum.photos/id/1018/300/200" alt="Imagen original" class="imagen-original">
  </div>

</body>
</html>
