<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 5.5</title>
  <style>
    .caja {
      width: 100px;
      height: 100px;
      border: 3px solid black;
      margin: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }

    .caja-1 {
      border-radius: 10px;
      background-color: lightcoral;
    }

    .caja-2 {
      border-radius: 50px;
      background-color: lightgreen;
    }

    .caja-3 {
      border-radius: 100px;
      background-color: gold;
    }
  </style>
</head>
<body>

  <div class="caja caja-1">
    <b>border-radius: 10px</b>
  </div>

  <div class="caja caja-2">
    <b>border-radius: 50px</b>
  </div>

  <div class="caja caja-3">
    <b>border-radius: 100px</b>
  </div>

</body>
</html>
