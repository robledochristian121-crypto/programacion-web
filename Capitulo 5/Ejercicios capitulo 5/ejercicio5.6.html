<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 5.6</title>
  <style>
    .caja {
      width: 200px;
      height: 200px;
      margin: 30px;
      display: inline-block;
      vertical-align: top;
      box-sizing: border-box;
      padding: 15px;
      font-family: sans-serif;
    }

    /* Primera caja */
    .caja-1 {
      background-color: lightskyblue;
      box-shadow: 15px 15px 20px dimgrey;
    }

    /* Segunda caja */
    .caja-2 {
      background-color: lightsalmon;
      box-shadow: -15px -15px 30px dimgrey;
    }

    /* Tercera caja */
    .caja-3 {
      background-color: mediumseagreen;
      box-shadow: 15px 15px 10px dimgrey;
    }
  </style>
</head>
<body>

  <div class="caja caja-1">
    <strong>Caja 1</strong><br>
    Desplazamiento H: 15px<br>
    Desplazamiento V: 15px<br>
    Desenfoque: 20px
  </div>

  <div class="caja caja-2">
    <strong>Caja 2</strong><br>
    Desplazamiento H: -15px<br>
    Desplazamiento V: -15px<br>
    Desenfoque: 30px
  </div>

  <div class="caja caja-3">
    <strong>Caja 3</strong><br>
    Desplazamiento H: 15px<br>
    Desplazamiento V: 15px<br>
    Desenfoque: 10px
  </div>

</body>
</html>
